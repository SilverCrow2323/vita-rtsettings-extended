name: Tai Saver Core CI

on:
  push:
    branches:
      - main
      - feat/tai-saver-core
  pull_request:
    paths:
      - "include/**"
      - "source/**"
      - "tests/**"
      - "tai-saver/**"
      - "Makefile"
      - "Makefile.vita"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host build, regression suite and sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static library and run regression tests
        run: |
          make clean
          make all
          make test
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize
